# Templar Campaign Configuration for Google Gruyere Sandbox (Simple)
# Run: templar crusade start --config configs/gruyere_simple.yaml

target_url: "https://google-gruyere.appspot.com/587129948244799578676866416043766319720/"

allowed_domains:
  - "google-gruyere.appspot.com"

excluded_paths:
  - "/logout"
  - "/signout"
  - "/delete"

scan_depth: shallow   # Quick test

output_dir: "./reports/gruyere_simple"

rate_limit:
  requests_per_second: 3  # Very gentle on the sandbox

